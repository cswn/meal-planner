<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meal Planner Wheel</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    padding: 1.5rem;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.5rem;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    background: #faf8f5;
    color: #2b2b2b;
  }
  h1 {
    margin: 0;
    font-weight: 600;
    font-size: clamp(1.5rem, 6vw, 2.25rem);
    letter-spacing: -0.02em;
    text-align: center;
  }
  .hint { margin: -1rem 0 0; color: #9a948c; font-size: 0.9rem; }
  svg {
    width: min(90vw, 70dvh);
    height: min(90vw, 70dvh);
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    filter: drop-shadow(0 12px 30px rgba(60, 40, 20, 0.12));
  }
  #wheel {
    transform-origin: 200px 200px;
    transition: transform 4s cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  #wheel text { font-size: 11px; font-weight: 500; fill: #3d3a36; }
  #result {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(250, 248, 245, 0.6);
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
  }
  #result.show { display: flex; }
  #result.show .card { animation: pop 0.25s ease-out; }
  @keyframes pop {
    from { opacity: 0; transform: scale(0.95); }
  }
  .card {
    position: relative;
    padding: 2.5rem 3.5rem 2rem;
    max-width: 80vw;
    box-sizing: border-box;
    text-align: center;
    overflow-wrap: anywhere;
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 20px 50px rgba(60, 40, 20, 0.15);
  }
  .label {
    display: block;
    margin-bottom: 0.5rem;
    font-size: 0.75rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #9a948c;
  }
  #recipe { font-size: 1.75rem; font-weight: 600; letter-spacing: -0.01em; }
  .card button {
    position: absolute;
    top: 0.5rem;
    right: 0.5rem;
    width: 44px;
    height: 44px;
    border: none;
    border-radius: 50%;
    background: none;
    font-size: 1.5rem;
    line-height: 1;
    cursor: pointer;
    color: #9a948c;
  }
  .card button:hover { background: #f3f0eb; }
</style>
</head>
<body>
<h1>Meal Planner Wheel</h1>
<p class="hint">Tap the wheel to spin</p>
<svg viewBox="0 0 400 400">
  <g id="wheel"></g>
  <circle cx="200" cy="200" r="22" fill="#fff" />
  <circle cx="200" cy="200" r="6" fill="#2b2b2b" />
  <path d="M188,2 L212,2 L200,26 Z" fill="#2b2b2b" stroke="#2b2b2b" stroke-width="4" stroke-linejoin="round" />
</svg>
<div id="result">
  <div class="card">
    <button id="close" aria-label="Close">&times;</button>
    <span class="label">Tonight</span>
    <span id="recipe"></span>
  </div>
</div>
<script>
  const C = 200, R = 195;
  const wheel = document.getElementById('wheel');
  const result = document.getElementById('result');
  let recipes = [], rotation = 0, spinning = false, pick = 0;

  const point = (deg, r) => {
    const a = deg * Math.PI / 180;
    return [C + r * Math.sin(a), C - r * Math.cos(a)];
  };

  fetch('recipes.csv').then(r => r.text()).then(text => {
    const [header, ...rows] = text.trim().split('\n').map(l => l.split(','));
    recipes = rows.map(row => Object.fromEntries(header.map((h, i) => [h.trim(), row[i]?.trim()])));
    draw();
  });

  function draw() {
    const seg = 360 / recipes.length;
    wheel.innerHTML = recipes.map((r, i) => {
      const [x1, y1] = point(i * seg, R);
      const [x2, y2] = point((i + 1) * seg, R);
      const mid = (i + 0.5) * seg;
      return `<path d="M${C},${C} L${x1},${y1} A${R},${R} 0 0 1 ${x2},${y2} Z"
                fill="hsl(${i * 360 / recipes.length} 55% 88%)" stroke="#fff" stroke-width="2" />
              <text x="${C + R - 12}" y="${C}" text-anchor="end" dominant-baseline="middle"
                transform="rotate(${mid - 90} ${C} ${C})">${r.name}</text>`;
    }).join('');
  }

  document.querySelector('svg').addEventListener('click', () => {
    if (spinning || !recipes.length || result.classList.contains('show')) return;
    spinning = true;
    const seg = 360 / recipes.length;
    pick = Math.floor(Math.random() * recipes.length);
    const target = (360 - (pick + 0.5) * seg) % 360;
    rotation += 5 * 360 + ((target - rotation) % 360 + 360) % 360;
    wheel.style.transform = `rotate(${rotation}deg)`;
  });

  wheel.addEventListener('transitionend', () => {
    spinning = false;
    document.getElementById('recipe').textContent = recipes[pick].name;
    result.classList.add('show');
  });

  document.getElementById('close').addEventListener('click', () => result.classList.remove('show'));
</script>
</body>
</html>
